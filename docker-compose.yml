name: tripeasy

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-15}
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_USER: ${POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_DB_USER} -d ${POSTGRES_DB_NAME}']
      interval: 5s
      retries: 10

  flyway:
    image: flyway/flyway:10.20.1
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - '-url=jdbc:postgresql://postgres:5432/${POSTGRES_DB_NAME}'
      - '-user=${POSTGRES_DB_USER}'
      - '-password=${POSTGRES_DB_PASSWORD}'
      - '-locations=filesystem:/flyway/sql'
      - '-connectRetries=10'
      - 'migrate'
    volumes:
      - ./backend/migrations:/flyway/sql:ro

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - '8025:8025'
      - '1025:1025'

  backend:
    build:
      context: ./backend
      target: dev
    env_file: .env
    depends_on:
      flyway:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    volumes:
      - ./backend:/usr/backend
      - /usr/backend/node_modules
      - uploads:/usr/backend/uploads
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:${PORT:-3000}/api/v1/health']
      interval: 5s
      retries: 20

volumes:
  pgdata:
  uploads:

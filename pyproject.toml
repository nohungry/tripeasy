[project]
name = "tripeasy-tests"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
  "pytest==8.3.3",
  "requests==2.32.3",
  "psycopg[binary]==3.2.3",
  "PyJWT==2.9.0",
  "python-dotenv==1.0.1",
  "pytest-playwright==0.5.2",
  "cryptography==50.0.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "e2e"]
addopts = "-ra"
pythonpath = ["tests"]

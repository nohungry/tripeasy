name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 固定 runner 版本：ubuntu-latest 映像改版會讓系統套件與 Python 跟著漂移（見 docs/reports/phase-2.md §3.3）
    runs-on: ubuntu-24.04
    # 正常約數分鐘到十餘分鐘（含 apt 安裝 Chromium 依賴）；30 分鐘擋真卡死，避免預設 360 分鐘空轉
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: 讀取 refs.env
        run: cat refs.env >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          repository: nohungry/tripeasy-backend
          ref: ${{ env.BACKEND_REF }}
          path: backend

      - uses: actions/checkout@v7
        with:
          repository: nohungry/tripeasy-frontend
          ref: ${{ env.FRONTEND_REF }}
          path: frontend

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"

      - name: 啟動服務並測試
        run: scripts/ci.sh

      - name: 收集 compose log
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: compose-logs
          path: compose-logs.txt
